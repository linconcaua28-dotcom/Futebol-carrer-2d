name: Gerar APK Carreira 2D

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar pasta do projeto Android
        run: |
          mkdir -p /tmp/android_proj
          if ls *.zip 1> /dev/null 2>&1; then
            mkdir -p /tmp/extracted
            unzip -q *.zip -d /tmp/extracted
            PROJ_DIR=$(dirname "$(find /tmp/extracted -name "settings.gradle" | head -n 1)")
          else
            PROJ_DIR=$(dirname "$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)")
          fi
          cp -r "$PROJ_DIR"/. /tmp/android_proj/
          mv /tmp/android_proj android_proj

      - name: Compilar APK
        working-directory: android_proj
        run: gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Carreira2D-APK
          path: android_proj/app/build/outputs/apk/debug/*.apk
          
