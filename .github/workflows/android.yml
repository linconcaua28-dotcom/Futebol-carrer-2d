
name: Gerar APK Carreira 2D

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle" ] || [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find . -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -type f)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android Gradle não encontrado."
            echo "O repositório precisa conter settings.gradle (ou settings.gradle.kts)"
            echo "e app/build.gradle (ou app/build.gradle.kts)."
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "${{ steps.projeto.outputs.dir }}" --no-daemon --stacktrace assembleDebug

      - name: Enviar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: Carreira2D-APK
          path: ${{ steps.projeto.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
