
name: Build APK Android 16

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Procurar projeto Android
        id: projeto
        run: |
          echo "Procurando arquivos Android..."

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR=$(dirname "$file")

            if [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -name settings.gradle -o -name settings.gradle.kts)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Android não encontrado."
            echo "Arquivos existentes:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Instalar SDK 36
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        working-directory: ${{ steps.projeto.outputs.project_dir }}
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Futebol-Carreira-2D-APK
          path: ${{ steps.projeto.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
